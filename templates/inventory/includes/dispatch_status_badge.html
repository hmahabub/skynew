<span class="badge bg-{% if dispatch.status == 'dispatched' %}success{% elif dispatch.status == 'on_going' %}info{% else %}secondary{% endif %}">{{ dispatch.get_status_display }}</span>{% if dispatch.dispatch_approval == 'pending' %}
<span class="badge bg-warning text-dark" title="Waiting for an admin to approve it as Dispatched">Awaiting Approval</span>{% endif %}{% if dispatch.is_status_locked %}
<i class="fas fa-lock text-muted small" title="Approved as Dispatched - status is locked"></i>{% endif %}
